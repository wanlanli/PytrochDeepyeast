_BASE_: ../Cityscapes-PanopticSegmentation/Base-PanopticDeepLab-OS16.yaml
MODEL:
  # WEIGHTS: "detectron2://DeepLab/R-52.pkl"
  WEIGHTS: "/home/liwa/data/oneformer_output/output/model_0159999_v2.pth"
  PIXEL_MEAN: [102.364, 102.364, 102.364]
  PIXEL_STD: [23.532, 23.532, 23.532]
  BACKBONE:
    NAME: "build_resnet_deeplab_backbone"
  RESNETS:
    DEPTH: 50
    NORM: "SyncBN"
    RES5_MULTI_GRID: [1, 2, 4]
    STEM_TYPE: "deeplab"
    STEM_OUT_CHANNELS: 128
    STRIDE_IN_1X1: False
  RETINANET:
    NUM_CLASSES: 8
  SEM_SEG_HEAD:
    NUM_CLASSES: 8
    LOSS_WEIGHT: 2.0
  ROI_BOX_HEAD:
    FED_LOSS_NUM_CLASSES: 8
  ROI_HEADS:
    NUM_CLASSES: 8
  PANOPTIC_DEEPLAB:
    SIZE_DIVISIBILITY: 512
DATASETS:
  TRAIN: ("yeastcity_train",)
  TEST: ("yeastcity_test",)
SOLVER:
  BASE_LR: 0.0005
  # The last full 200k-iter run plateaued hard in its second half: loss_sem_seg only
  # went 0.085 -> 0.0836 and val mIoU only 36.01 -> 36.08 across the last ~75k iters
  # (roughly the last 1.5 of its ~2d22h wall-clock time). Cut to 130k so the
  # WarmupPolyLR schedule anneals to ~0 by the point training actually stops being
  # useful, instead of spending another day past the plateau.
  MAX_ITER: 130000 #200000
  IMS_PER_BATCH: 16
  CHECKPOINT_PERIOD: 5000 #5000
TEST:
  EVAL_PERIOD: 5000
INPUT:
  FORMAT: "RGB"
  GAUSSIAN_SIGMA: 8
  # MIN_SIZE_TRAIN: !!python/object/apply:eval ["[int(x * 0.1 * 512) for x in range(5, 41)]"]
  MIN_SIZE_TRAIN: (0.5, 2)
  MIN_SIZE_TRAIN_SAMPLING: "range"
  MIN_SIZE_TEST: 512
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048
  SMALL_INSTANCE_AREA: 0
  SMALL_INSTANCE_WEIGHT: 1
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (512, 512)
OUTPUT_DIR: /home/liwa/data/oneformer_output/output